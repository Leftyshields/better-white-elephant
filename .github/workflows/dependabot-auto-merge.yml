name: Dependabot Auto-merge

# Squash auto-merge for Dependabot pull requests. Auto-merge waits for required
# status checks only once those checks are configured on the default branch.
# The main branch ruleset still requires an approving review unless Dependabot
# has a ruleset bypass for that approval rule.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
