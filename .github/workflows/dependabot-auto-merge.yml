name: Dependabot Auto-merge

# Squash auto-merge for Dependabot pull requests. Uses a per-repo fine-grained PAT
# (Contents, Pull requests, Workflows read/write) stored as the Dependabot secret
# DEPENDABOT_AUTOMERGE_TOKEN so the merge push can trigger deploy workflows.
# Auto-merge waits for required status checks once those checks are configured
# on the default branch; the main ruleset is moving to zero required approvals.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    permissions: {}

    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::DEPENDABOT_AUTOMERGE_TOKEN Dependabot secret is not set"; exit 1; fi
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
