name: Deploy game server to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: better-white-elephant
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY_REPO: game-server
  CLOUD_RUN_SERVICE: stealorreveal-game-server
  IMAGE_NAME: stealorreveal-game-server
  GAME_SERVER_RUNTIME_SERVICE_ACCOUNT: game-server-runtime@better-white-elephant.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build and deploy to Cloud Run
    if: github.ref == 'refs/heads/main'
    environment: game-server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push container image
        working-directory: ./server
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2.7.6
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE_URI }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
            --min-instances=1
            --max-instances=1
            --no-cpu-throttling
            --session-affinity
            --timeout=3600
            --service-account=${{ env.GAME_SERVER_RUNTIME_SERVICE_ACCOUNT }}
          env_vars: |
            NODE_ENV=production
            ALLOWED_ORIGINS=https://stealorreveal.com,https://www.stealorreveal.com
          secrets: |
            REDIS_URL=game-server-redis-url:latest
            FIREBASE_PROJECT_ID=game-server-firebase-project-id:latest
            FIREBASE_CLIENT_EMAIL=game-server-firebase-client-email:latest
            FIREBASE_PRIVATE_KEY=game-server-firebase-private-key:latest

      - name: Show service URL
        run: |
          echo "Deployed Cloud Run service URL (set VITE_SERVER_URL to this after verifying /health):"
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)'
